<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b10"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a1526"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066ff"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e6f4ff"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052cc" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00d2ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f293d" stroke-width="0.75" stroke-opacity="0.35"/>
      <circle cx="40" cy="40" r="1" fill="#00d2ff" fill-opacity="0.25"/>
    </pattern>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Outfit', 'Inter', Roboto, sans-serif;
        font-weight: 800;
        font-size: 58px;
        letter-spacing: -1px;
      }
      .tagline {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
        font-weight: 500;
        font-size: 20px;
        letter-spacing: 0.5px;
        fill: #8b949e;
      }
      .chip-text {
        font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .highlight {
        fill: #00d2ff;
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Background Blobs -->
  <circle cx="200" cy="80" r="160" fill="#0052cc" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1020" cy="220" r="180" fill="#7928ca" opacity="0.10" filter="url(#glow)"/>
  <circle cx="600" cy="160" r="120" fill="#00d2ff" opacity="0.08" filter="url(#glow)"/>

  <!-- Top Decorative Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)" rx="2"/>

  <!-- Tech Status Pulse -->
  <g transform="translate(60, 52)">
    <circle cx="0" cy="0" r="5" fill="#00d2ff" opacity="0.4">
      <animate attributeName="r" values="4;9;4" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="4" fill="#00d2ff"/>
    <text x="16" y="4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#00d2ff" letter-spacing="1">SYSTEM ARCHITECT // HIGH PERFORMANCE</text>
  </g>

  <!-- Main Identity Header -->
  <text x="60" y="132" class="title" fill="url(#textGrad)">Edi Manrique</text>

  <!-- Technical Description / Subtitle -->
  <text x="60" y="180" class="tagline">
    Systems Engineering <tspan fill="#30363d">•</tspan> 
    <tspan fill="#58a6ff">Zero-Alloc Cryptography</tspan> <tspan fill="#30363d">•</tspan> 
    <tspan fill="#e6edf3">WASM &amp; Edge Runtimes</tspan>
  </text>

  <!-- High-Tech Tech Chips (Pills) -->
  <g transform="translate(60, 225)">
    <!-- Rust -->
    <g transform="translate(0, 0)">
      <rect width="105" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
      <circle cx="20" cy="18" r="4" fill="#dea584"/>
      <text x="32" y="23" class="chip-text" fill="#f0883e">Rust</text>
    </g>

    <!-- Zig -->
    <g transform="translate(120, 0)">
      <rect width="90" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
      <circle cx="18" cy="18" r="4" fill="#ec915c"/>
      <text x="30" y="23" class="chip-text" fill="#f39c12">Zig</text>
    </g>

    <!-- WebAssembly -->
    <g transform="translate(225, 0)">
      <rect width="165" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
      <circle cx="20" cy="18" r="4" fill="#654ff0"/>
      <text x="34" y="23" class="chip-text" fill="#a371f7">WebAssembly</text>
    </g>

    <!-- AssemblyScript -->
    <g transform="translate(405, 0)">
      <rect width="180" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
      <circle cx="20" cy="18" r="4" fill="#007acc"/>
      <text x="34" y="23" class="chip-text" fill="#58a6ff">AssemblyScript</text>
    </g>

    <!-- Solidity -->
    <g transform="translate(600, 0)">
      <rect width="125" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
      <circle cx="20" cy="18" r="4" fill="#aa67fe"/>
      <text x="34" y="23" class="chip-text" fill="#bc8cff">Solidity</text>
    </g>

    <!-- Zero-Alloc -->
    <g transform="translate(740, 0)">
      <rect width="145" height="36" rx="8" fill="#0d1f38" stroke="#00d2ff" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="20" cy="18" r="4" fill="#00d2ff"/>
      <text x="34" y="23" class="chip-text" fill="#79c0ff">Zero-Alloc</text>
    </g>
  </g>

  <!-- Right Geometric Decorative Motif -->
  <g transform="translate(1080, 150)" opacity="0.75">
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>
    <polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="none" stroke="#00d2ff" stroke-width="1" opacity="0.5"/>
    <circle cx="0" cy="0" r="6" fill="#00d2ff"/>
  </g>

  <!-- Outer Rounded Border Line -->
  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1" opacity="0.6"/>
</svg>
